name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: typecheck + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sonar:
    # Automatic Analysis aktif di SonarCloud untuk eiaiproject_Bagarry, jadi
    # tidak ada scanner di CI. Job ini polling status quality gate publik
    # (tanpa token) agar deploy tertahan bila gate merah.
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Tunggu dan cek quality gate SonarCloud
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s "https://sonarcloud.io/api/qualitygates/project_status?projectKey=eiaiproject_Bagarry" | python3 -c "import json,sys; print(json.load(sys.stdin).get('projectStatus',{}).get('status','NONE'))")
            echo "Percobaan $i: status=$STATUS"
            if [ "$STATUS" = "OK" ]; then exit 0; fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "FAILED" ]; then echo "Quality gate MERAH."; exit 1; fi
            sleep 20
          done
          echo "Quality gate belum ada hasil (NONE) setelah 10 menit. Anggap gagal."
          exit 1

  e2e:
    name: e2e Playwright
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: Jalankan e2e (reset DB + server sendiri)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  deploy-staging:
    name: deploy ke staging
    runs-on: ubuntu-latest
    needs: [quality, sonar, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://bagarry-staging.eiai.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrasi D1 staging
        run: npm run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
